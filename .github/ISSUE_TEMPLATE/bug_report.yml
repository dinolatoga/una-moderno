name: Bug report
description: Report a reproducible layout, tooling, or example problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Please use fictional or public sample content. Do not include credentials or private-site material.
        For security concerns, follow the repository's SECURITY.md instead of posting details here.
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: Include the commit SHA or branch you tested.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Core CSS or HTML templates
        - Static HTML example
        - Tailwind integration or example
        - Astro reference
        - Documentation or tooling
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the command or page, steps, and a minimal public fixture if useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain the difference. Include sanitized screenshots or logs when they help.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/version, viewport width, operating system, and Node/npm versions for tooling issues.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification already tried
      description: Include relevant command outcomes or whether the problem occurs in another example.
